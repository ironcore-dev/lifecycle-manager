version = 1
SPDX-PackageName = "lifecycle-manager"
SPDX-PackageSupplier = "IronCore authors <ospo@sap.com>"
SPDX-PackageDownloadLocation = "https://github.com/ironcore-dev/lifecycle-manager"

[[annotations]]
path = [".docker", ".github/**", ".gitignore", ".golangci.yml", "buf.gen.yaml", "buf.work.yaml", "CODEOWNERS", "Makefile", "PROJECT", "api/proto/**", "clientgo/openapi/api_violations.report", "clientgo/connectrpc/**", "config/**", "go.mod", "go.sum", "hack/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2024 SAP SE or an SAP affiliate company and IronCore contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["docs/**", "README.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2024 SAP SE or an SAP affiliate company and IronCore contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "utils/envtest/internal/testing/certs/certs.go"
precedence = "aggregate"
SPDX-FileCopyrightText = "2021 The Kubernetes Authors."
SPDX-License-Identifier = "Apache-2.0"
